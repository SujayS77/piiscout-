[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "piiscout"
version = "0.1.0"
description = "Open source tool to detect and redact personal data (Aadhaar, PAN, phone, email, UPI) in datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sujay Shetty" }]
keywords = ["pii", "privacy", "redaction", "data-protection", "aadhaar"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# preshed is capped: version 3.0.14 makes spaCy fail to load its models (OverflowError).
ner = ["spacy>=3.7,<3.9", "preshed<3.0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
